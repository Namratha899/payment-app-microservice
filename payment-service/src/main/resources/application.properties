spring.application.name=payment-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
spring.datasource.username=${DB_USERNAME:paymentuser}
spring.datasource.password=${DB_PASSWORD:paymentpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
info.app.name=payment-service
info.app.description=Demo payment microservice
